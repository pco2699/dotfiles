name: Test install

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Take the same fast path as Codespaces: skip fisher and the mise
  # language-runtime installs (compiling Python/Node/Go in CI is too slow).
  # The distro system packages and the fast mise CLI-tool installs still run
  # in full, so the verify step below can check every CLI tool.
  CODESPACES: "true"
  # mise resolves tool versions via the GitHub API (aqua/vfox/ubi backends).
  # Without a token it uses the 60/hr unauthenticated limit and fails in CI;
  # the built-in Actions token raises this to 5000/hr.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ubuntu:
    name: Ubuntu (runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: chezmoi init + apply
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --apply --source="$GITHUB_WORKSPACE"

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          for cmd in fish nvim gh fd rg zoxide bat fzf eza mise herdr claude; do
            command -v "$cmd" || { echo "::error::$cmd not found"; exit 1; }
          done
          test -f ~/.config/fish/config.fish
          test -f ~/.config/herdr/config.toml
          test -f ~/.config/nvim/init.lua

  linux-container:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            bootstrap: apt-get update && apt-get install -y sudo curl git ca-certificates
            # all CLI tools now come from mise under their canonical names
            commands: fish nvim gh fd rg zoxide bat fzf eza mise herdr claude
          - name: Fedora (latest)
            image: fedora:latest
            bootstrap: dnf install -y sudo curl git tar gzip
            # all CLI tools now come from mise under their canonical names
            commands: fish nvim gh fd rg zoxide bat fzf eza mise herdr claude
          - name: Arch Linux (latest)
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm sudo curl git
            # all CLI tools now come from mise under their canonical names
            commands: fish nvim gh fd rg zoxide bat fzf eza mise herdr claude
    steps:
      # A bare container image needs the tools chezmoi's install script
      # takes for granted (a fresh interactive machine would have these).
      - name: Install prerequisites
        run: ${{ matrix.bootstrap }}

      - uses: actions/checkout@v7

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: chezmoi init + apply
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --apply --source="$GITHUB_WORKSPACE"

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          for cmd in ${{ matrix.commands }}; do
            command -v "$cmd" || { echo "::error::$cmd not found"; exit 1; }
          done
          test -f ~/.config/fish/config.fish
          test -f ~/.config/herdr/config.toml
          test -f ~/.config/nvim/init.lua

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: chezmoi init + apply
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --apply --source="$GITHUB_WORKSPACE"

      - name: Verify installation
        run: |
          # go and the other language runtimes are skipped in CI (CODESPACES),
          # so only the always-installed CLI tools are verified here.
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          for cmd in fish nvim gh fd rg zoxide bat fzf ghq mise herdr claude; do
            command -v "$cmd" || { echo "::error::$cmd not found"; exit 1; }
          done
          test -f ~/.config/fish/config.fish
          test -f ~/.config/herdr/config.toml
          test -f ~/.config/nvim/init.lua

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi
        run: iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$env:USERPROFILE\bin'"

      # `chezmoi init` renders .chezmoi.toml.tmpl, which writes only [data], so
      # --source is not persisted into the generated config: every command below
      # has to be pointed at the checkout explicitly or it reads the (empty)
      # default source directory and never sees .chezmoidata.
      - name: chezmoi init
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:USERPROFILE\bin;$env:PATH"
          chezmoi init --source="$env:GITHUB_WORKSPACE"

      # winget can't run non-interactively on a GitHub runner, so the install
      # itself isn't exercised. What is checked is everything up to that point:
      # the target state resolves, no Unix dotfile leaks into the Windows home
      # directory, and the generated PowerShell actually parses.
      - name: Verify Windows target state
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:USERPROFILE\bin;$env:PATH"
          chezmoi apply --dry-run --verbose --source="$env:GITHUB_WORKSPACE"

          $managed = chezmoi managed --source="$env:GITHUB_WORKSPACE"
          if ($managed -match '\.config') {
            Write-Output $managed
            throw "Windows must not manage any dotfiles, but .config entries are in the target state"
          }

      - name: Verify the Windows scripts render and parse
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:USERPROFILE\bin;$env:PATH"

          # Each script paired with something only its rendered form contains,
          # so a template that silently renders empty fails here.
          $expected = @{
            'run_onchange_after_configure-explorer.ps1.tmpl' = 'Explorer\\Advanced'
            'run_onchange_after_install-packages.ps1.tmpl'   = 'winget install'
            'run_onchange_after_install-pi.ps1.tmpl'         = 'pi-coding-agent'
            'run_onchange_after_remap-keyboard.ps1.tmpl'     = 'Scancode Map'
          }

          # Discovered rather than listed, so a script added later cannot skip
          # this check by never being added to the table above. The count has
          # to match too, or a glob that quietly matches nothing would leave
          # the loop below with nothing to do and still pass.
          $scripts = @(Get-ChildItem .chezmoiscripts\*.ps1.tmpl)
          if ($scripts.Count -ne $expected.Count) {
            throw "found $($scripts.Count) Windows scripts, but $($expected.Count) are listed above"
          }

          foreach ($file in $scripts) {
            Write-Output "checking $($file.Name)"

            if (-not $expected.ContainsKey($file.Name)) {
              throw "$($file.Name) has no expected marker; add one to this step"
            }

            $script = Get-Content -Raw $file.FullName |
              chezmoi execute-template --source="$env:GITHUB_WORKSPACE" | Out-String

            if ($script -notmatch $expected[$file.Name]) {
              throw "$($file.Name) rendered to something unexpected:`n$script"
            }

            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Output $_.ToString() }
              throw "the rendered $($file.Name) is not valid PowerShell"
            }
          }

      # Nothing above ever executes a script, so a chezmoi that cannot run
      # PowerShell at all still passes every check. Restricted is the default
      # execution policy on Windows client editions and the one that blocked
      # the real installers; process scope is inherited by the powershell
      # chezmoi spawns, so setting it here reproduces a stock machine.
      - name: Verify chezmoi runs PowerShell scripts under a Restricted policy
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:USERPROFILE\bin;$env:PATH"

          # A throwaway source directory holding one trivial script, so this
          # exercises chezmoi's script runner without running the installers.
          $source = Join-Path $env:RUNNER_TEMP 'probe-source'
          $dest = Join-Path $env:RUNNER_TEMP 'probe-dest'
          $marker = Join-Path $env:RUNNER_TEMP 'probe-ran.txt'
          New-Item -ItemType Directory -Force -Path $source, $dest | Out-Null
          Set-Content -Path (Join-Path $source 'run_probe.ps1') `
            -Value "Set-Content -Path '$marker' -Value ran"

          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Restricted -Force

          # First without the interpreter settings, so a pass below cannot be
          # the runner simply allowing scripts anyway.
          $control = Join-Path $env:RUNNER_TEMP 'control-config.toml'
          Set-Content -Path $control -Value ''
          $PSNativeCommandUseErrorActionPreference = $false
          chezmoi apply --config="$control" --source="$source" --destination="$dest"
          $controlExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($controlExit -eq 0 -or (Test-Path $marker)) {
            throw "the probe ran without the interpreter settings, so this check proves nothing"
          }

          # Then with the config chezmoi init generated, which must run it.
          chezmoi apply --source="$source" --destination="$dest"
          if (-not (Test-Path $marker)) {
            throw "chezmoi did not run the probe script under a Restricted execution policy"
          }

      # The remap is a binary blob assembled at run time, so parsing the script
      # says nothing about the bytes it would write. Build them here the same
      # way the script does and check them against the known-good map for the
      # pairs in keyboard.yaml, the bytes SharpKeys writes for them.
      - name: Verify the keyboard remap produces the expected scancode map
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:USERPROFILE\bin;$env:PATH"
          $script = Get-Content -Raw .chezmoiscripts\run_onchange_after_remap-keyboard.ps1.tmpl |
            chezmoi execute-template --source="$env:GITHUB_WORKSPACE" | Out-String

          # Everything up to and including New-ScancodeMap, which is the part
          # that reads the remap list and turns it into bytes. Running past it
          # would touch the registry.
          $marker = '$desired = [byte[]](New-ScancodeMap $remaps)'
          $index = $script.IndexOf($marker)
          if ($index -lt 0) { throw "the remap script no longer builds its map with $marker" }
          Invoke-Expression $script.Substring(0, $index + $marker.Length)

          $actual = ($desired | ForEach-Object { $_.ToString('x2') }) -join ''
          $expected = '0000000000000000030000001d005be01d003a0000000000'
          if ($actual -ne $expected) {
            throw "scancode map is $actual, expected $expected"
          }
