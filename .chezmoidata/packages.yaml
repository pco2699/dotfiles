# Windows applications, installed with winget by
# .chezmoiscripts/run_onchange_after_install-packages.ps1.tmpl.
#
# The script embeds a hash of this list, so adding or removing an entry here is
# enough to make `chezmoi apply` re-run the installer on every Windows machine.
# IDs are exact winget identifiers from the community `winget` source; look one
# up with `winget search <name>`.
packages:
  winget:
    - Microsoft.VisualStudioCode
    - Microsoft.WindowsTerminal
    # Herdr ships only a preview channel on winget, hence the .Preview suffix
    # in the identifier. It is a portable zip; winget pulls in the VC++
    # redistributable it depends on.
    - Herdr.Herdr.Preview
    - Microsoft.PowerToys
    - Git.Git
    - GitHub.cli
    - OpenJS.NodeJS.LTS
    - Python.Python.3.14
    # Lowercase publisher, as astral-sh publishes it.
    - astral-sh.uv
    - Anthropic.Claude
    - Obsidian.Obsidian
    - Foxit.FoxitReader
    - SST.OpenCodeDesktop
    - Telegram.TelegramDesktop
    - Valve.Steam
